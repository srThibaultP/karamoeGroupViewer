<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karamoe Group Viewer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎤</text></svg>">
<style>
    :root {
        color-scheme: light;
        --bg: #f4f5fa;
        --bg-elevated: #ffffff;
        --bg-inset: #eef0f8;
        --border: #dfe2ee;
        --text: #1c1e2b;
        --text-muted: #6b7086;
        --accent: #6c5ce7;
        --accent-soft: #ece9fd;
        --accent-contrast: #ffffff;
        --ok: #21a179;
        --ok-bg: #e3f6ef;
        --warn: #b8860b;
        --warn-bg: #fdf3d9;
        --over: #d64550;
        --over-bg: #fbe6e6;
        --zero: #9297ab;
        --zero-bg: #eceef4;
        --shadow: 0 1px 2px rgba(20, 20, 40, .04), 0 8px 24px rgba(20, 20, 40, .06);
        --radius: 14px;
    }

    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            color-scheme: dark;
            --bg: #14151f;
            --bg-elevated: #1c1e2b;
            --bg-inset: #23253564;
            --border: #2e3145;
            --text: #eceef7;
            --text-muted: #9599b3;
            --accent: #9c8cff;
            --accent-soft: #2a2650;
            --accent-contrast: #14151f;
            --ok: #3ecf9a;
            --ok-bg: #12332a;
            --warn: #e0b23d;
            --warn-bg: #3a2f10;
            --over: #f0707a;
            --over-bg: #3a1a1e;
            --zero: #6b7086;
            --zero-bg: #23253c;
            --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
        }
    }

    :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #14151f;
        --bg-elevated: #1c1e2b;
        --bg-inset: #23253564;
        --border: #2e3145;
        --text: #eceef7;
        --text-muted: #9599b3;
        --accent: #9c8cff;
        --accent-soft: #2a2650;
        --accent-contrast: #14151f;
        --ok: #3ecf9a;
        --ok-bg: #12332a;
        --warn: #e0b23d;
        --warn-bg: #3a2f10;
        --over: #f0707a;
        --over-bg: #3a1a1e;
        --zero: #6b7086;
        --zero-bg: #23253c;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.45;
    }

    .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 24px 20px 80px;
    }

    header.top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 20px;
    }

    h1 {
        font-size: 1.5rem;
        margin: 0 0 4px;
    }

    #playlistDescription {
        color: var(--text-muted);
        margin: 0;
        font-style: italic;
    }

    .icon-btn {
        border: 1px solid var(--border);
        background: var(--bg-elevated);
        color: var(--text);
        border-radius: 10px;
        padding: 8px 10px;
        cursor: pointer;
        font-size: 1rem;
        line-height: 1;
        flex-shrink: 0;
    }

    .icon-btn:hover { border-color: var(--accent); }

    .card {
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 18px;
        margin-bottom: 16px;
    }

    .dropzone {
        border: 2px dashed var(--border);
        border-radius: var(--radius);
        padding: 28px 20px;
        text-align: center;
        color: var(--text-muted);
        cursor: pointer;
        transition: border-color .15s, background .15s;
        margin-bottom: 16px;
    }

    .dropzone.drag { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
    .dropzone strong { color: var(--text); }
    .dropzone input { display: none; }

    .field-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px 16px;
    }

    .field label {
        display: block;
        font-size: .8rem;
        color: var(--text-muted);
        margin-bottom: 4px;
    }

    input[type="text"], input[type="number"], select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg-inset);
        color: var(--text);
        font-size: .95rem;
    }

    input:focus, select:focus, button:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
    }

    button {
        font: inherit;
    }

    .btn {
        background: var(--accent);
        color: var(--accent-contrast);
        border: none;
        border-radius: 8px;
        padding: 8px 14px;
        cursor: pointer;
        font-weight: 600;
        white-space: nowrap;
    }

    .btn.secondary {
        background: var(--bg-inset);
        color: var(--text);
        border: 1px solid var(--border);
    }

    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
        margin-bottom: 16px;
    }

    .stat {
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px;
        box-shadow: var(--shadow);
    }

    .stat .value { font-size: 1.3rem; font-weight: 700; }
    .stat .label { font-size: .78rem; color: var(--text-muted); }

    .progress-outer {
        background: var(--bg-inset);
        border-radius: 999px;
        height: 10px;
        overflow: hidden;
        margin-top: 8px;
    }

    .progress-inner {
        height: 100%;
        border-radius: 999px;
        background: var(--accent);
        width: 0;
        transition: width .8s ease;
    }

    .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: flex-end;
        margin-bottom: 16px;
    }

    .toolbar .field { flex: 1 1 220px; min-width: 180px; }

    .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
    }

    .chip {
        border: 1px solid var(--border);
        background: var(--bg-inset);
        color: var(--text-muted);
        padding: 4px 10px;
        border-radius: 999px;
        font-size: .78rem;
        cursor: pointer;
        user-select: none;
    }

    .chip.active {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-contrast);
    }

    #participantsList {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
    }

    .participant {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px 4px 4px;
        border-radius: 999px;
        background: var(--bg-inset);
        border: 1px solid var(--border);
        cursor: pointer;
        font-size: .85rem;
    }

    .participant:hover { border-color: var(--accent); }

    .avatar {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: .7rem;
        font-weight: 700;
        color: #fff;
        flex-shrink: 0;
    }

    .split-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
    }

    .split-row select, .split-row input[type="number"] { width: auto; min-width: 140px; }

    .split-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
    }

    .split-tag {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--accent-soft);
        color: var(--text);
        border-radius: 999px;
        padding: 4px 6px 4px 12px;
        font-size: .82rem;
    }

    .split-tag button {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-muted);
        font-size: .9rem;
        line-height: 1;
        padding: 2px 4px;
    }

    .user-section {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin-bottom: 12px;
        overflow: hidden;
        background: var(--bg-elevated);
        box-shadow: var(--shadow);
    }

    .user-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        cursor: pointer;
    }

    .user-header:hover { background: var(--bg-inset); }

    .toggle-caret {
        border: none;
        background: none;
        color: var(--text-muted);
        font-size: .9rem;
        transition: transform .15s;
        flex-shrink: 0;
        cursor: pointer;
    }

    .user-section.expanded .toggle-caret { transform: rotate(90deg); }

    .user-name { font-weight: 700; flex-shrink: 0; }

    .status-badge {
        font-size: .72rem;
        font-weight: 700;
        padding: 2px 9px;
        border-radius: 999px;
        white-space: nowrap;
    }

    .status-badge.ok { color: var(--ok); background: var(--ok-bg); }
    .status-badge.warn { color: var(--warn); background: var(--warn-bg); }
    .status-badge.over { color: var(--over); background: var(--over-bg); }
    .status-badge.zero { color: var(--zero); background: var(--zero-bg); }

    .user-meta {
        margin-left: auto;
        color: var(--text-muted);
        font-size: .85rem;
        text-align: right;
        flex-shrink: 0;
    }

    .user-bar-wrap { padding: 0 14px 12px; }

    .kara-container {
        max-height: 0;
        overflow: hidden;
        transition: max-height .25s ease;
        border-top: 1px solid transparent;
    }

    .user-section.expanded .kara-container {
        max-height: 4000px;
        border-top: 1px solid var(--border);
        transition: max-height .4s ease;
    }

    .kara-item {
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
    }

    .kara-item:last-child { border-bottom: none; }

    .kara-title { font-weight: 600; }

    .kara-info {
        font-size: .85rem;
        color: var(--text-muted);
        margin-top: 2px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
    }

    .tag {
        padding: 1px 7px;
        border-radius: 5px;
        font-size: .72rem;
        cursor: help;
    }

    .tag.songtype { background: var(--warn-bg); color: var(--warn); }
    .tag.misc { background: var(--accent-soft); color: var(--accent); }
    .tag.version { font-style: italic; background: none; color: var(--accent); padding-left: 0; }

    .kara-item.fake { border-left: 3px dashed var(--accent); padding-left: 13px; }

    .fake-remove {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-muted);
        font-size: .75rem;
        margin-left: 4px;
        vertical-align: middle;
    }

    .fake-remove:hover { color: var(--over); }

    .hint {
        font-size: .8rem;
        color: var(--text-muted);
        margin: 0 0 10px;
    }

    #playlistOutput:empty::after,
    .empty-state {
        display: block;
        text-align: center;
        color: var(--text-muted);
        padding: 30px 10px;
    }

    .hidden { display: none !important; }

    .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translate(-50%, 20px);
        background: var(--text);
        color: var(--bg);
        padding: 10px 18px;
        border-radius: 999px;
        font-size: .88rem;
        opacity: 0;
        transition: opacity .2s, transform .2s;
        pointer-events: none;
        z-index: 10;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    footer.foot {
        text-align: center;
        color: var(--text-muted);
        font-size: .78rem;
        margin-top: 30px;
    }

    footer.foot a { color: inherit; }
</style>
</head>

<body>
<div class="wrap">
    <header class="top">
        <div>
            <h1 id="pageTitle">🎤 Karamoe Group Viewer</h1>
            <p id="playlistDescription"></p>
        </div>
        <button class="icon-btn" id="themeToggle" title="Changer de thème">🌗</button>
    </header>

    <div class="dropzone" id="dropzone">
        <div id="dropzoneText">
            📂 Glissez-déposez un fichier <strong>.kmplaylist</strong> ici, ou cliquez pour en choisir un
        </div>
        <input type="file" id="fileInput" accept=".kmplaylist,.json">
    </div>

    <div id="app" class="hidden">
        <div class="card">
            <div class="field-grid">
                <div class="field">
                    <label for="theoreticalTime">Temps théorique total (minutes)</label>
                    <input type="number" id="theoreticalTime" value="180" min="1">
                </div>
                <div class="field">
                    <label for="theoreticalUsers">Nombre d'utilisateurs théorique</label>
                    <input type="number" id="theoreticalUsers" value="15" min="1">
                </div>
                <div class="field">
                    <label for="sortSelect">Trier les participants par</label>
                    <select id="sortSelect">
                        <option value="duration-desc">Durée (décroissant)</option>
                        <option value="duration-asc">Durée (croissant)</option>
                        <option value="songs-desc">Nb karaokés (décroissant)</option>
                        <option value="name-asc">Nom (A → Z)</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="stats-grid" id="statsGrid"></div>

        <div class="card">
            <div class="toolbar">
                <div class="field">
                    <label for="searchInput">Rechercher un karaoké</label>
                    <input type="text" id="searchInput" placeholder="Titre ou artiste...">
                </div>
                <button class="btn secondary" id="toggleAllBtn">Tout dérouler</button>
                <button class="btn secondary" id="exportBtn">📋 Copier le résumé</button>
            </div>
            <div id="tagFilters"></div>
        </div>

        <div class="card">
            <div class="split-row">
                <label for="splitUserSelect" style="flex-basis:100%;font-size:.8rem;color:var(--text-muted);margin-bottom:2px;">
                    Diviser la durée d'un participant entre plusieurs personnes
                </label>
                <select id="splitUserSelect"></select>
                <input type="number" id="splitCount" value="2" min="2">
                <button class="btn secondary" id="addSplitBtn">Ajouter</button>
            </div>
            <div class="split-list" id="splitList"></div>
        </div>

        <div class="card">
            <p class="hint" style="margin-top:0;">
                Ajouter des karaokés fictifs, absents du fichier importé (utile si vous préparez un complément à ajouter plus tard, par ex. depuis kara.moe vers un autre dépôt).
            </p>
            <div class="field-grid">
                <div class="field">
                    <label for="fakeTitle">Titre</label>
                    <input type="text" id="fakeTitle" placeholder="Titre du karaoké">
                </div>
                <div class="field">
                    <label for="fakeArtist">Artiste (optionnel)</label>
                    <input type="text" id="fakeArtist" placeholder="Nom de l'artiste">
                </div>
                <div class="field">
                    <label for="fakeDuration">Durée (mm:ss)</label>
                    <input type="text" id="fakeDuration" placeholder="3:30">
                </div>
                <div class="field">
                    <label for="fakeUser">Participant</label>
                    <input type="text" id="fakeUser" list="fakeUserList" placeholder="Nom du participant">
                    <datalist id="fakeUserList"></datalist>
                </div>
            </div>
            <button class="btn secondary" id="addFakeBtn" style="margin-top:10px;">➕ Ajouter le karaoké fictif</button>
            <div class="split-list" id="fakeList"></div>
        </div>

        <div class="card" id="participantsCard">
            <strong>Participants</strong>
            <span id="participantCount" style="color:var(--text-muted);font-size:.85rem;"></span>
            <div id="participantsList"></div>
        </div>

        <div id="playlistOutput"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
    "use strict";

    const state = {
        data: null,
        splits: {},        // { nickname: count }
        activeTags: new Set(),
        fakeKaras: [],      // manually added, non-imported karaokes
        theme: null
    };

    const $ = id => document.getElementById(id);

    const els = {
        dropzone: $('dropzone'),
        fileInput: $('fileInput'),
        app: $('app'),
        theoreticalTime: $('theoreticalTime'),
        theoreticalUsers: $('theoreticalUsers'),
        sortSelect: $('sortSelect'),
        searchInput: $('searchInput'),
        toggleAllBtn: $('toggleAllBtn'),
        exportBtn: $('exportBtn'),
        tagFilters: $('tagFilters'),
        splitUserSelect: $('splitUserSelect'),
        splitCount: $('splitCount'),
        addSplitBtn: $('addSplitBtn'),
        splitList: $('splitList'),
        fakeTitle: $('fakeTitle'),
        fakeArtist: $('fakeArtist'),
        fakeDuration: $('fakeDuration'),
        fakeUser: $('fakeUser'),
        fakeUserList: $('fakeUserList'),
        addFakeBtn: $('addFakeBtn'),
        fakeList: $('fakeList'),
        participantsList: $('participantsList'),
        participantCount: $('participantCount'),
        statsGrid: $('statsGrid'),
        playlistOutput: $('playlistOutput'),
        playlistDescription: $('playlistDescription'),
        pageTitle: $('pageTitle'),
        themeToggle: $('themeToggle'),
        toast: $('toast')
    };

    // ---------- utilities ----------

    function escapeHtml(str) {
        return String(str ?? '').replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function normalize(str) {
        return String(str ?? '')
            .toLowerCase()
            .normalize('NFD')
            .replace(/[̀-ͯ]/g, '');
    }

    function formatHMS(totalSeconds) {
        totalSeconds = Math.max(0, Math.round(totalSeconds || 0));
        const h = Math.floor(totalSeconds / 3600);
        const m = Math.floor((totalSeconds % 3600) / 60);
        const s = Math.floor(totalSeconds % 60);
        let str = '';
        if (h > 0) str += h + 'h';
        if (m > 0) str += (str ? ' ' : '') + m + 'min';
        if (s > 0 || (!h && !m)) str += (str ? ' ' : '') + s + 's';
        return str;
    }

    function parseDuration(input) {
        const str = String(input || '').trim();
        if (!str) return 0;
        if (str.includes(':')) {
            const parts = str.split(':').map(p => parseFloat(p.replace(',', '.')) || 0);
            let seconds = 0;
            for (const p of parts) seconds = seconds * 60 + p;
            return Math.max(0, Math.round(seconds));
        }
        return Math.max(0, Math.round(parseFloat(str.replace(',', '.')) || 0));
    }

    function debounce(fn, wait) {
        let t;
        return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), wait); };
    }

    function showToast(msg) {
        els.toast.textContent = msg;
        els.toast.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => els.toast.classList.remove('show'), 1800);
    }

    function hashColor(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
        const hue = Math.abs(hash) % 360;
        return `hsl(${hue}, 55%, 45%)`;
    }

    function loadSetting(key, fallback) {
        try {
            const v = localStorage.getItem('kgv_' + key);
            return v === null ? fallback : v;
        } catch { return fallback; }
    }

    function saveSetting(key, value) {
        try { localStorage.setItem('kgv_' + key, value); } catch { /* storage unavailable */ }
    }

    // ---------- theme ----------

    function initTheme() {
        const saved = loadSetting('theme', null);
        if (saved) document.documentElement.setAttribute('data-theme', saved);
        state.theme = saved;
    }

    els.themeToggle.addEventListener('click', () => {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const current = document.documentElement.getAttribute('data-theme') || (prefersDark ? 'dark' : 'light');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        saveSetting('theme', next);
    });

    initTheme();

    // ---------- data extraction ----------

    function getKaraokesFromPlaylist(data) {
        if (!data) return [];
        if (Array.isArray(data.PlaylistContents) && data.PlaylistContents.length) return data.PlaylistContents;
        for (const key in data) {
            if (Array.isArray(data[key]) && data[key][0] && data[key][0].kid) return data[key];
        }
        return [];
    }

    function getEffectiveKaraokes() {
        return getKaraokesFromPlaylist(state.data).concat(state.fakeKaras);
    }

    function getAllUsers(data) {
        const set = new Set();
        getEffectiveKaraokes().forEach(k => set.add(k.nickname || 'Inconnu'));
        data?.PlaylistInformation?.contributors?.forEach(c => c?.nickname && set.add(c.nickname));
        return [...set];
    }

    function karaTitle(k) {
        return k.titles?.eng || k.titles?.qro || k.titles?.jpn || Object.values(k.titles || {})[0] || 'Sans titre';
    }

    function karaArtists(k) {
        const groups = (k.singergroups || []).map(s => s.name);
        const singers = (k.singers || []).map(s => s.name);
        let artists = groups.map(n => `[${n}]`).join(' ');
        if (groups.length && singers.length) artists += ' ';
        artists += singers.join(', ');
        return artists || 'Artiste inconnu';
    }

    function collectTags(karaList) {
        const map = new Map(); // name -> {type, count}
        karaList.forEach(k => {
            (k.songtypes || []).forEach(t => {
                const key = 'type:' + t.name;
                map.set(key, { name: t.name, kind: 'songtype', count: (map.get(key)?.count || 0) + 1 });
            });
            (k.misc || []).forEach(m => {
                const key = 'misc:' + m.name;
                map.set(key, { name: m.name, kind: 'misc', count: (map.get(key)?.count || 0) + 1 });
            });
        });
        return map;
    }

    // ---------- file loading ----------

    function handleFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            try {
                const parsed = JSON.parse(e.target.result);
                if (!getKaraokesFromPlaylist(parsed).length) {
                    throw new Error('Aucun karaoké trouvé dans ce fichier');
                }
                state.data = parsed;
                state.splits = {};
                state.activeTags = new Set();
                state.fakeKaras = [];
                onPlaylistLoaded();
            } catch (err) {
                console.error(err);
                showToast('Erreur : fichier invalide (' + err.message + ')');
            }
        };
        reader.onerror = () => showToast('Erreur de lecture du fichier');
        reader.readAsText(file);
    }

    els.fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

    ['dragenter', 'dragover'].forEach(evt => {
        els.dropzone.addEventListener(evt, e => { e.preventDefault(); els.dropzone.classList.add('drag'); });
    });
    ['dragleave', 'drop'].forEach(evt => {
        els.dropzone.addEventListener(evt, e => { e.preventDefault(); els.dropzone.classList.remove('drag'); });
    });
    els.dropzone.addEventListener('drop', e => handleFile(e.dataTransfer.files[0]));
    els.dropzone.addEventListener('click', e => {
        if (e.target !== els.fileInput) els.fileInput.click();
    });

    function onPlaylistLoaded() {
        const info = state.data.PlaylistInformation || {};
        const title = info.name || 'Playlist Karaoke Mugen';
        document.title = title;
        els.pageTitle.textContent = '🎤 ' + title;
        els.playlistDescription.textContent = info.description || '';

        els.theoreticalTime.value = loadSetting('theoreticalTime', els.theoreticalTime.value);
        els.theoreticalUsers.value = loadSetting('theoreticalUsers', els.theoreticalUsers.value);
        els.sortSelect.value = loadSetting('sortSelect', els.sortSelect.value);

        els.app.classList.remove('hidden');
        $('dropzoneText').innerHTML = `📂 <strong>${escapeHtml(title)}</strong> chargée — glissez un autre fichier pour la remplacer`;

        populateSplitSelect();
        populateFakeUserList();
        renderFakeList();
        renderAll();
    }

    // ---------- controls wiring ----------

    [els.theoreticalTime, els.theoreticalUsers].forEach(input => {
        input.addEventListener('input', () => {
            saveSetting(input.id, input.value);
            renderAll();
        });
    });

    els.sortSelect.addEventListener('change', () => {
        saveSetting('sortSelect', els.sortSelect.value);
        renderAll();
    });

    els.searchInput.addEventListener('input', debounce(renderAll, 150));

    els.exportBtn.addEventListener('click', exportSummary);

    els.addSplitBtn.addEventListener('click', () => {
        const user = els.splitUserSelect.value;
        const count = Math.max(2, +els.splitCount.value || 2);
        if (!user) return;
        state.splits[user] = count;
        renderSplitList();
        renderAll();
    });

    function populateSplitSelect() {
        els.splitUserSelect.innerHTML = '';
        getAllUsers(state.data).forEach(u => {
            const opt = document.createElement('option');
            opt.value = u; opt.textContent = u;
            els.splitUserSelect.appendChild(opt);
        });
    }

    function renderSplitList() {
        els.splitList.innerHTML = '';
        Object.entries(state.splits).forEach(([user, count]) => {
            const tag = document.createElement('span');
            tag.className = 'split-tag';
            tag.innerHTML = `${escapeHtml(user)} ÷ ${count} <button aria-label="Retirer">✕</button>`;
            tag.querySelector('button').addEventListener('click', () => {
                delete state.splits[user];
                renderSplitList();
                renderAll();
            });
            els.splitList.appendChild(tag);
        });
    }

    function populateFakeUserList() {
        els.fakeUserList.innerHTML = '';
        getAllUsers(state.data).forEach(u => {
            const opt = document.createElement('option');
            opt.value = u;
            els.fakeUserList.appendChild(opt);
        });
    }

    function addFakeKara() {
        const title = els.fakeTitle.value.trim();
        const artist = els.fakeArtist.value.trim();
        const user = els.fakeUser.value.trim();
        const duration = parseDuration(els.fakeDuration.value);

        if (!title || !user) {
            showToast('Le titre et le participant sont obligatoires');
            return;
        }

        state.fakeKaras.push({
            kid: 'fake-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
            nickname: user,
            duration,
            titles: { eng: title },
            singers: artist ? [{ name: artist }] : [],
            singergroups: [],
            songtypes: [],
            misc: [{ name: 'Ajout manuel', description: { fre: 'Karaoké ajouté manuellement, absent du fichier importé' } }],
            versions: [],
            fake: true
        });

        els.fakeTitle.value = '';
        els.fakeArtist.value = '';
        els.fakeDuration.value = '';
        els.fakeUser.value = '';
        els.fakeTitle.focus();

        populateSplitSelect();
        populateFakeUserList();
        renderFakeList();
        renderAll();
    }

    function removeFakeKara(kid) {
        state.fakeKaras = state.fakeKaras.filter(k => k.kid !== kid);
        populateSplitSelect();
        populateFakeUserList();
        renderFakeList();
        renderAll();
    }

    function renderFakeList() {
        els.fakeList.innerHTML = '';
        state.fakeKaras.forEach(k => {
            const tag = document.createElement('span');
            tag.className = 'split-tag';
            tag.innerHTML = `${escapeHtml(karaTitle(k))} — ${escapeHtml(k.nickname)} (${formatHMS(k.duration)}) <button aria-label="Retirer">✕</button>`;
            tag.querySelector('button').addEventListener('click', () => removeFakeKara(k.kid));
            els.fakeList.appendChild(tag);
        });
    }

    els.addFakeBtn.addEventListener('click', addFakeKara);
    [els.fakeTitle, els.fakeArtist, els.fakeDuration, els.fakeUser].forEach(input => {
        input.addEventListener('keydown', e => { if (e.key === 'Enter') addFakeKara(); });
    });

    // ---------- rendering ----------

    function renderAll() {
        if (!state.data) return;
        const karaListAll = getEffectiveKaraokes();
        const searchQuery = normalize(els.searchInput.value);

        renderTagFilters(karaListAll);

        const karaList = karaListAll.filter(k => {
            const title = karaTitle(k);
            const artists = karaArtists(k);
            const matchesSearch = !searchQuery ||
                normalize(title).includes(searchQuery) ||
                normalize(artists).includes(searchQuery);
            if (!matchesSearch) return false;
            if (state.activeTags.size === 0) return true;
            const kTags = new Set([
                ...((k.songtypes || []).map(t => 'type:' + t.name)),
                ...((k.misc || []).map(m => 'misc:' + m.name))
            ]);
            for (const tag of state.activeTags) if (kTags.has(tag)) return true;
            return false;
        });

        const theoreticalTime = Math.max(1, (+els.theoreticalTime.value || 180)) * 60;
        const theoreticalUsers = Math.max(1, (+els.theoreticalUsers.value || 15));
        const timePerUser = theoreticalTime / theoreticalUsers;
        const totalPlaylist = karaList.reduce((s, k) => s + (k.duration || 0), 0);

        renderStats(karaList, karaListAll, totalPlaylist, theoreticalTime, timePerUser, theoreticalUsers);
        renderParticipants(karaListAll);
        renderUsers(karaList, timePerUser);
    }

    function renderTagFilters(karaListAll) {
        const tags = collectTags(karaListAll);
        if (tags.size === 0) { els.tagFilters.innerHTML = ''; return; }
        const sorted = [...tags.entries()].sort((a, b) => b[1].count - a[1].count).slice(0, 24);
        els.tagFilters.innerHTML = '';
        const wrap = document.createElement('div');
        wrap.className = 'chips';
        sorted.forEach(([key, info]) => {
            const chip = document.createElement('span');
            chip.className = 'chip' + (state.activeTags.has(key) ? ' active' : '');
            chip.textContent = `${info.name} (${info.count})`;
            chip.addEventListener('click', () => {
                if (state.activeTags.has(key)) state.activeTags.delete(key);
                else state.activeTags.add(key);
                renderAll();
            });
            wrap.appendChild(chip);
        });
        els.tagFilters.appendChild(wrap);
    }

    function statusFor(total, timePerUser) {
        if (total === 0) return { cls: 'zero', label: 'Inactif' };
        if (total > timePerUser * 1.15) return { cls: 'over', label: 'Dépassement' };
        if (total > timePerUser) return { cls: 'warn', label: 'Limite' };
        return { cls: 'ok', label: 'OK' };
    }

    function renderStats(karaList, karaListAll, totalPlaylist, theoreticalTime, timePerUser, theoreticalUsers) {
        const users = getAllUsers(state.data);
        const activeUsers = new Set(karaList.map(k => k.nickname || 'Inconnu'));
        const percent = (totalPlaylist / theoreticalTime) * 100;

        els.statsGrid.innerHTML = `
            <div class="stat">
                <div class="value">${formatHMS(totalPlaylist)}</div>
                <div class="label">sur ${formatHMS(theoreticalTime)} théorique (${percent.toFixed(1)}%)</div>
                <div class="progress-outer"><div class="progress-inner" id="globalBar"></div></div>
            </div>
            <div class="stat">
                <div class="value">${karaList.length}</div>
                <div class="label">karaoké${karaList.length > 1 ? 's' : ''} ${karaList.length !== karaListAll.length ? `(sur ${karaListAll.length})` : ''}</div>
            </div>
            <div class="stat">
                <div class="value">${activeUsers.size} / ${users.length}</div>
                <div class="label">participants actifs</div>
            </div>
            <div class="stat">
                <div class="value">${formatHMS(timePerUser)}</div>
                <div class="label">temps théorique / participant (${theoreticalUsers} prévus)</div>
            </div>
        `;
        requestAnimationFrame(() => {
            const bar = $('globalBar');
            if (bar) bar.style.width = Math.min(100, percent) + '%';
        });
    }

    function renderParticipants(karaListAll) {
        const users = {};
        getAllUsers(state.data).forEach(u => users[u] = { total: 0, totalSongs: 0 });
        karaListAll.forEach(k => {
            const u = k.nickname || 'Inconnu';
            if (!users[u]) users[u] = { total: 0, totalSongs: 0 };
            users[u].total += k.duration || 0;
            users[u].totalSongs += 1;
        });

        const entries = sortEntries(Object.entries(users));
        els.participantsList.innerHTML = '';
        entries.forEach(([user, data]) => {
            const el = document.createElement('span');
            el.className = 'participant';
            el.title = `${user} : ${formatHMS(data.total)} (${data.totalSongs} karaoké${data.totalSongs > 1 ? 's' : ''}) — cliquer pour filtrer`;
            const initial = user.trim()[0]?.toUpperCase() || '?';
            el.innerHTML = `<span class="avatar" style="background:${hashColor(user)}">${escapeHtml(initial)}</span>${escapeHtml(user)}`;
            el.addEventListener('click', () => {
                document.querySelectorAll('.user-section').forEach(s => {
                    if (s.dataset.user === user) {
                        s.classList.add('expanded');
                        s.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                });
            });
            els.participantsList.appendChild(el);
        });
        els.participantCount.textContent = entries.length ? `— ${entries.length} participant(s)` : '';
    }

    function buildUserEntries(karaList) {
        const users = {};
        getAllUsers(state.data).forEach(u => users[u] = { total: 0, songs: [], totalSongs: 0 });
        karaList.forEach(k => {
            const u = k.nickname || 'Inconnu';
            if (!users[u]) users[u] = { total: 0, songs: [], totalSongs: 0 };
            users[u].total += k.duration || 0;
            users[u].totalSongs += 1;
            users[u].songs.push(k);
        });

        const entries = [];
        Object.entries(users).forEach(([user, data]) => {
            const splitCount = state.splits[user];
            if (splitCount && splitCount > 1 && data.songs.length) {
                for (let i = 1; i <= splitCount; i++) {
                    entries.push([`${user} (${i}/${splitCount})`, {
                        total: data.total / splitCount,
                        totalSongs: data.totalSongs / splitCount,
                        songs: data.songs,
                        baseUser: user
                    }]);
                }
            } else {
                entries.push([user, { ...data, baseUser: user }]);
            }
        });
        return entries.filter(([, d]) => d.songs.length > 0);
    }

    function sortEntries(entries) {
        const mode = els.sortSelect.value;
        const [key, dir] = mode.split('-');
        entries.sort((a, b) => {
            let diff = 0;
            if (key === 'duration') diff = a[1].total - b[1].total;
            else if (key === 'songs') diff = a[1].totalSongs - b[1].totalSongs;
            else diff = a[0].localeCompare(b[0]);
            if (dir === 'desc') diff = -diff;
            return diff || a[0].localeCompare(b[0]);
        });
        return entries;
    }

    function renderUsers(karaList, timePerUser) {
        const container = els.playlistOutput;
        const openState = new Map();
        container.querySelectorAll('.user-section').forEach(s => openState.set(s.dataset.key, s.classList.contains('expanded')));

        container.innerHTML = '';

        if (karaList.length === 0) {
            container.innerHTML = '<div class="empty-state">Aucun karaoké ne correspond à la recherche / aux filtres.</div>';
            updateToggleAllLabel();
            return;
        }

        const entries = sortEntries(buildUserEntries(karaList));
        const forceOpen = normalize(els.searchInput.value).length > 0 || state.activeTags.size > 0;

        entries.forEach(([user, data]) => {
            const status = statusFor(data.total, timePerUser);
            const key = user;
            const wasOpen = openState.has(key) ? openState.get(key) : false;

            const section = document.createElement('div');
            section.className = 'user-section' + ((forceOpen || wasOpen) ? ' expanded' : '');
            section.dataset.key = key;
            section.dataset.user = data.baseUser;

            const header = document.createElement('div');
            header.className = 'user-header';
            header.innerHTML = `
                <button class="toggle-caret" aria-label="Déplier">▶</button>
                <span class="avatar" style="background:${hashColor(data.baseUser)}">${escapeHtml((data.baseUser || '?').trim()[0]?.toUpperCase() || '?')}</span>
                <span class="user-name">${escapeHtml(user)}</span>
                <span class="status-badge ${status.cls}">${status.label}</span>
                <span class="user-meta">${formatHMS(data.total)} · ${Math.round(data.totalSongs)} karaoké${Math.round(data.totalSongs) !== 1 ? 's' : ''}</span>
            `;
            header.addEventListener('click', () => section.classList.toggle('expanded'));
            section.appendChild(header);

            const barWrap = document.createElement('div');
            barWrap.className = 'user-bar-wrap';
            const pct = timePerUser > 0 ? (data.total / timePerUser) * 100 : 0;
            barWrap.innerHTML = `<div class="progress-outer"><div class="progress-inner user-bar" style="background:var(--${status.cls})"></div></div>`;
            section.appendChild(barWrap);

            const karaContainer = document.createElement('div');
            karaContainer.className = 'kara-container';
            data.songs.forEach(k => {
                const item = document.createElement('div');
                item.className = 'kara-item' + (k.fake ? ' fake' : '');
                const title = karaTitle(k);
                const artists = karaArtists(k);
                const duration = formatHMS(k.duration || 0);
                const types = (k.songtypes || []).map(t => `<span class="tag songtype" title="${escapeHtml(t.description?.fre || t.description?.eng || t.name)}">${escapeHtml(t.name)}</span>`).join(' ');
                const miscTags = (k.misc || []).map(m => `<span class="tag misc" title="${escapeHtml(m.description?.fre || m.description?.eng || m.name)}">${escapeHtml(m.name)}</span>`).join(' ');
                const versions = (k.versions || []).map(v => `<span class="tag version" title="${escapeHtml(v.description?.fre || v.description?.eng || v.name)}">${escapeHtml(v.name)}</span>`).join(' ');
                const removeBtn = k.fake ? '<button class="fake-remove" title="Retirer ce karaoké fictif">✕</button>' : '';
                item.innerHTML = `
                    <div class="kara-title">${escapeHtml(title)} ${versions}${removeBtn}</div>
                    <div class="kara-info"><span>${escapeHtml(artists)} — ${duration}</span>${types}${miscTags}</div>
                `;
                if (k.fake) item.querySelector('.fake-remove').addEventListener('click', () => removeFakeKara(k.kid));
                karaContainer.appendChild(item);
            });
            section.appendChild(karaContainer);
            container.appendChild(section);

            requestAnimationFrame(() => {
                const bar = section.querySelector('.user-bar');
                if (bar) bar.style.width = Math.min(100, pct) + '%';
            });
        });

        updateToggleAllLabel();
    }

    function updateToggleAllLabel() {
        const sections = document.querySelectorAll('.user-section');
        const anyClosed = [...sections].some(s => !s.classList.contains('expanded'));
        els.toggleAllBtn.textContent = anyClosed ? 'Tout dérouler' : 'Tout replier';
        els.toggleAllBtn.disabled = sections.length === 0;
    }

    els.toggleAllBtn.addEventListener('click', () => {
        const sections = document.querySelectorAll('.user-section');
        const anyClosed = [...sections].some(s => !s.classList.contains('expanded'));
        sections.forEach(s => s.classList.toggle('expanded', anyClosed));
        updateToggleAllLabel();
    });

    function exportSummary() {
        const karaListAll = getEffectiveKaraokes();
        const theoreticalTime = Math.max(1, (+els.theoreticalTime.value || 180)) * 60;
        const theoreticalUsers = Math.max(1, (+els.theoreticalUsers.value || 15));
        const timePerUser = theoreticalTime / theoreticalUsers;
        const entries = sortEntries(buildUserEntries(karaListAll));

        const title = state.data.PlaylistInformation?.name || 'Playlist';
        let lines = [`📋 ${title}`, ''];
        entries.forEach(([user, data]) => {
            const status = statusFor(data.total, timePerUser);
            lines.push(`• ${user} — ${formatHMS(data.total)} (${Math.round(data.totalSongs)} karaokés) [${status.label}]`);
        });
        const text = lines.join('\n');

        const finish = () => showToast('Résumé copié dans le presse-papier !');
        if (navigator.clipboard?.writeText) {
            navigator.clipboard.writeText(text).then(finish).catch(() => fallbackCopy(text, finish));
        } else {
            fallbackCopy(text, finish);
        }
    }

    function fallbackCopy(text, done) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(); }
        catch { showToast('Impossible de copier automatiquement'); }
        document.body.removeChild(ta);
    }
})();
</script>
</body>

</html>
